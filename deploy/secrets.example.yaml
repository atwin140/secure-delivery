# Documentation only. NOT part of kustomization. Operators provision through
# their approved secret manager. Never commit populated copies.
apiVersion: v1
kind: Secret
metadata: { name: delivery-database, namespace: secure-delivery }
type: Opaque
stringData:
  password: REPLACE_SAME_DATABASE_PASSWORD
---
apiVersion: v1
kind: Secret
metadata: { name: delivery-postgres-admin, namespace: secure-delivery }
type: Opaque
stringData: { password: REPLACE_POSTGRES_ADMIN_PASSWORD }
---
apiVersion: v1
kind: Secret
metadata: { name: delivery-backup, namespace: secure-delivery }
type: Opaque
stringData:
  password: REPLACE_BACKUP_PASSWORD
  pgpass: "delivery-postgres.secure-delivery.svc:5432:delivery:delivery_backup:REPLACE_BACKUP_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata: { name: delivery-s3, namespace: secure-delivery }
type: Opaque
stringData:
  { access-key: REPLACE_S3_ACCESS_KEY, secret-key: REPLACE_S3_SECRET_KEY }
---
apiVersion: v1
kind: Secret
metadata: { name: delivery-oidc, namespace: secure-delivery }
type: Opaque
stringData: { client-secret: REPLACE_OIDC_CLIENT_SECRET }
---
apiVersion: v1
kind: Secret
metadata: { name: delivery-graph, namespace: secure-delivery }
type: Opaque
stringData: { client-secret: REPLACE_GRAPH_CLIENT_SECRET }
