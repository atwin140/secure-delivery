apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: delivery-metadata-backups }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: REPLACE_BLOCK_STORAGE_CLASS
  resources: { requests: { storage: 10Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: delivery-metadata-backup }
spec:
  schedule: "0 2 * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata: { labels: { app: delivery-backup } }
        spec:
          restartPolicy: Never
          serviceAccountName: delivery-db
          automountServiceAccountToken: false
          securityContext:
            { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: backup
              image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
              command: [/bin/bash, /scripts/backup.sh]
              env:
                - name: DATABASE_HOST
                  valueFrom:
                    {
                      configMapKeyRef:
                        { name: delivery-config, key: DATABASE_HOST },
                    }
              securityContext:
                {
                  allowPrivilegeEscalation: false,
                  readOnlyRootFilesystem: true,
                  capabilities: { drop: [ALL] },
                }
              resources:
                {
                  requests: { cpu: 100m, memory: 128Mi },
                  limits: { cpu: "1", memory: 512Mi },
                }
              volumeMounts:
                - { name: backups, mountPath: /backups }
                - { name: tmp, mountPath: /tmp }
                - {
                    name: credentials,
                    mountPath: /backup-secret,
                    readOnly: true,
                  }
                - { name: ca, mountPath: /trust, readOnly: true }
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - {
                name: backups,
                persistentVolumeClaim: { claimName: delivery-metadata-backups },
              }
            - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
            - {
                name: credentials,
                secret: { secretName: delivery-backup, defaultMode: 288 },
              }
            - { name: ca, configMap: { name: delivery-internal-trust } }
            - { name: scripts, configMap: { name: delivery-backup-script } }
