apiVersion: v1
kind: Namespace
metadata:
  name: secure-delivery
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: delivery
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: delivery-db
automountServiceAccountToken: false
