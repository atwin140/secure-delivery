apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  name: secure-delivery
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: delivery
  namespace: secure-delivery
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: delivery-db
  namespace: secure-delivery
---
apiVersion: v1
data:
  backup.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    umask 077
    cp /backup-secret/pgpass /tmp/pgpass
    chmod 600 /tmp/pgpass
    export PGPASSFILE=/tmp/pgpass
    export PGSSLMODE=verify-full PGSSLROOTCERT=/trust/service-ca.crt
    target="/backups/metadata-$(date -u +%Y%m%dT%H%M%SZ).dump"
    trap 'rm -f /tmp/pgpass "${target}.partial"' EXIT
    if ! pg_dump --host="${DATABASE_HOST:?}" --username=delivery_backup --dbname=delivery --format=custom --file="${target}.partial" 2>/dev/null; then echo 'Metadata backup failed.' >&2; exit 1; fi
    pg_restore --list "${target}.partial" >/dev/null
    mv "${target}.partial" "$target"
    find /backups -type f -name 'metadata-*.dump' -mtime +29 -delete
    echo 'Metadata backup completed and archive listing verified.'
kind: ConfigMap
metadata:
  name: delivery-backup-script
  namespace: secure-delivery
---
apiVersion: v1
data:
  APP_INTERNAL_HOST: delivery.secure-delivery.svc
  APP_ORIGIN: https://REPLACE_HOST
  AUDIT_RETENTION_DAYS: "90"
  BRAND_NAME: Secure Delivery
  DATABASE_CA_FILE: /trust/service/service-ca.crt
  DATABASE_HOST: delivery-postgres.secure-delivery.svc
  DATABASE_NAME: delivery
  DATABASE_PASSWORD_FILE: /secrets/database/password
  DATABASE_USER: delivery
  GRAPH_CLIENT_ID: REPLACE_GRAPH_CLIENT_ID
  GRAPH_CLIENT_SECRET_FILE: /secrets/graph/client-secret
  GRAPH_MAILBOX: REPLACE_DEDICATED_MAILBOX
  GRAPH_TENANT_ID: REPLACE_TENANT_ID
  NODE_EXTRA_CA_CERTS: /trust/external/ca-bundle.pem
  OIDC_CLIENT_ID: secure-delivery
  OIDC_CLIENT_SECRET_FILE: /secrets/oidc/client-secret
  OIDC_ISSUER: https://REPLACE_KEYCLOAK/realms/REPLACE_REALM
  OIDC_REQUIRED_ROLE: repository-sender
  OIDC_ROLE_CLIENT: secure-delivery
  RETRIEVAL_ENABLED: "false"
  S3_ACCESS_KEY_FILE: /secrets/s3/access-key
  S3_BUCKET: REPLACE_DOCUMENT_BUCKET
  S3_ENDPOINT: https://REPLACE_ODF_ENDPOINT
  S3_REGION: REPLACE_ODF_REGION
  S3_SECRET_KEY_FILE: /secrets/s3/secret-key
  S3_STORAGE_CLASS: REPLACE_S3_PROVISIONING_CLASS
  SUPPORT_TEXT: Contact your sender for access help.
  TLS_CERT_FILE: /tls/tls.crt
  TLS_KEY_FILE: /tls/tls.key
kind: ConfigMap
metadata:
  name: delivery-config
  namespace: secure-delivery
---
apiVersion: v1
data:
  ca-bundle.pem: REPLACE_WITH_TRUSTED_EXTERNAL_CA_PEM
kind: ConfigMap
metadata:
  name: delivery-external-ca
  namespace: secure-delivery
---
apiVersion: v1
data:
  pg_hba.conf: |
    local all all reject
    hostnossl all all 0.0.0.0/0 reject
    hostnossl all all ::/0 reject
    hostssl delivery delivery 0.0.0.0/0 scram-sha-256
    hostssl delivery delivery ::/0 scram-sha-256
    hostssl delivery delivery_backup 0.0.0.0/0 scram-sha-256
    hostssl delivery delivery_backup ::/0 scram-sha-256
    hostssl all postgres 0.0.0.0/0 scram-sha-256
    hostssl all postgres ::/0 scram-sha-256
kind: ConfigMap
metadata:
  name: delivery-postgres-config
  namespace: secure-delivery
---
apiVersion: v1
data: {}
kind: ConfigMap
metadata:
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
  name: delivery-service-ca
  namespace: secure-delivery
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: delivery-app-tls
  labels:
    app: delivery
  name: delivery
  namespace: secure-delivery
spec:
  ports:
  - name: https
    port: 8443
    targetPort: https
  selector:
    app: delivery
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: delivery-postgres-tls
  name: delivery-postgres
  namespace: secure-delivery
spec:
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  selector:
    app: delivery-postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: delivery-metadata-backups
  namespace: secure-delivery
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: REPLACE_BLOCK_STORAGE_CLASS
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: delivery
  namespace: secure-delivery
spec:
  replicas: 2
  selector:
    matchLabels:
      app: delivery
  template:
    metadata:
      labels:
        app: delivery
    spec:
      automountServiceAccountToken: false
      containers:
      - envFrom:
        - configMapRef:
            name: delivery-config
        image: REPLACE_APP_IMAGE_DIGEST
        imagePullPolicy: IfNotPresent
        livenessProbe:
          exec:
            command:
            - node
            - --import
            - tsx
            - scripts/admin.ts
            - live
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 8
        name: app
        ports:
        - containerPort: 8443
          name: https
        readinessProbe:
          exec:
            command:
            - node
            - --import
            - tsx
            - scripts/admin.ts
            - health
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 8
        resources:
          limits:
            cpu: "2"
            memory: 768Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /secrets/database
          name: database
          readOnly: true
        - mountPath: /secrets/oidc
          name: oidc
          readOnly: true
        - mountPath: /secrets/s3
          name: s3
          readOnly: true
        - mountPath: /secrets/graph
          name: graph
          readOnly: true
        - mountPath: /tls
          name: tls
          readOnly: true
        - mountPath: /trust/service
          name: service-ca
          readOnly: true
        - mountPath: /trust/external
          name: external-ca
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: delivery
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          medium: Memory
          sizeLimit: 64Mi
        name: tmp
      - name: database
        secret:
          defaultMode: 288
          secretName: delivery-database
      - name: oidc
        secret:
          defaultMode: 288
          secretName: delivery-oidc
      - name: s3
        secret:
          defaultMode: 288
          secretName: delivery-s3
      - name: graph
        secret:
          defaultMode: 288
          secretName: delivery-graph
      - name: tls
        secret:
          defaultMode: 288
          secretName: delivery-app-tls
      - configMap:
          name: delivery-service-ca
        name: service-ca
      - configMap:
          name: delivery-external-ca
        name: external-ca
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: delivery-postgres
  namespace: secure-delivery
spec:
  replicas: 1
  selector:
    matchLabels:
      app: delivery-postgres
  serviceName: delivery-postgres
  template:
    metadata:
      labels:
        app: delivery-postgres
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_DB
          value: delivery
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD_FILE
          value: /admin-secret/password
        - name: POSTGRES_INITDB_ARGS
          value: --auth-host=scram-sha-256
        image: REPLACE_POSTGRES_IMAGE_DIGEST
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          initialDelaySeconds: 15
          periodSeconds: 10
          tcpSocket:
            port: postgres
        resources:
          limits:
            cpu: "2"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /backup-secret
          name: backup-secret
          readOnly: true
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /tmp
          name: tmp
        - mountPath: /var/run/postgresql
          name: socket
        - mountPath: /tls
          name: tls
          readOnly: true
        - mountPath: /config
          name: config
          readOnly: true
        - mountPath: /admin-secret
          name: admin-secret
          readOnly: true
        - mountPath: /app-secret
          name: app-secret
          readOnly: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: delivery-db
      terminationGracePeriodSeconds: 90
      volumes:
      - name: backup-secret
        secret:
          defaultMode: 288
          secretName: delivery-backup
      - emptyDir:
          medium: Memory
          sizeLimit: 128Mi
        name: tmp
      - emptyDir:
          medium: Memory
          sizeLimit: 16Mi
        name: socket
      - name: tls
        secret:
          defaultMode: 288
          secretName: delivery-postgres-tls
      - configMap:
          name: delivery-postgres-config
        name: config
      - name: admin-secret
        secret:
          defaultMode: 288
          secretName: delivery-postgres-admin
      - name: app-secret
        secret:
          defaultMode: 288
          secretName: delivery-database
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: REPLACE_BLOCK_STORAGE_CLASS
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: delivery-metadata-backup
  namespace: secure-delivery
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: delivery-backup
        spec:
          automountServiceAccountToken: false
          containers:
          - command:
            - /bin/bash
            - /scripts/backup.sh
            env:
            - name: DATABASE_HOST
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_HOST
                  name: delivery-config
            image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
            name: backup
            resources:
              limits:
                cpu: "1"
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: /backups
              name: backups
            - mountPath: /tmp
              name: tmp
            - mountPath: /backup-secret
              name: credentials
              readOnly: true
            - mountPath: /trust
              name: ca
              readOnly: true
            - mountPath: /scripts
              name: scripts
              readOnly: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: delivery-db
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: delivery-metadata-backups
          - emptyDir:
              medium: Memory
              sizeLimit: 16Mi
            name: tmp
          - name: credentials
            secret:
              defaultMode: 288
              secretName: delivery-backup
          - configMap:
              name: delivery-service-ca
            name: ca
          - configMap:
              name: delivery-backup-script
            name: scripts
  schedule: 0 2 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  timeZone: Etc/UTC
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: delivery
  namespace: secure-delivery
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: delivery
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-database
  namespace: secure-delivery
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: delivery
    - podSelector:
        matchLabels:
          app: delivery-backup
    ports:
    - port: 5432
      protocol: TCP
  podSelector:
    matchLabels:
      app: delivery-postgres
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-self-health
  namespace: secure-delivery
spec:
  egress:
  - ports:
    - port: 8443
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: delivery
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: delivery
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app: delivery
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: secure-delivery
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: required-internal-egress
  namespace: secure-delivery
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    - port: 5353
      protocol: UDP
    - port: 5353
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-dns
  - ports:
    - port: 5432
      protocol: TCP
    to:
    - podSelector:
        matchLabels:
          app: delivery-postgres
  podSelector: {}
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-to-app
  namespace: secure-delivery
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: ingress
    ports:
    - port: 8443
      protocol: TCP
  podSelector:
    matchLabels:
      app: delivery
  policyTypes:
  - Ingress
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  annotations:
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "30"
    haproxy.router.openshift.io/timeout: 3600s
  name: delivery
  namespace: secure-delivery
spec:
  host: REPLACE_HOST
  port:
    targetPort: https
  tls:
    destinationCACertificate: REPLACE_WITH_SERVICE_CA_PEM
    insecureEdgeTerminationPolicy: Redirect
    termination: reencrypt
  to:
    kind: Service
    name: delivery
