  namespace: secure-delivery-test
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: delivery-backup
        spec:
          automountServiceAccountToken: false
          containers:
            - command:
                - /bin/bash
                - /scripts/backup.sh
              env:
                - name: DATABASE_HOST
                  valueFrom:
                    configMapKeyRef:
                      key: DATABASE_HOST
                      name: delivery-config
              image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
              name: backup
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - mountPath: /backups
                  name: backups
                - mountPath: /tmp
                  name: tmp
                - mountPath: /backup-secret
                  name: credentials
                  readOnly: true
                - mountPath: /trust
                  name: ca
                  readOnly: true
                - mountPath: /scripts
                  name: scripts
                  readOnly: true
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: delivery-db
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: delivery-metadata-backups
            - emptyDir:
                medium: Memory
                sizeLimit: 16Mi
              name: tmp
            - name: credentials
              secret:
                defaultMode: 288
                secretName: delivery-backup
            - configMap:
                name: delivery-service-ca
              name: ca
            - configMap:
                name: delivery-backup-script
              name: scripts
          imagePullSecrets:
            - name: test-registry-push
  schedule: 0 2 * * *
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  timeZone: Etc/UTC
  suspend: true
