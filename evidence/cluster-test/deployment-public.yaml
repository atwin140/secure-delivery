apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-identity
  namespace: secure-delivery-test
  labels:
    app.kubernetes.io/part-of: secure-delivery-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-identity
  template:
    metadata:
      labels:
        app: test-identity
    spec:
      serviceAccountName: test-identity
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-runtime
          image: registry.redhat.io/rhbk/keycloak-rhel9@sha256:52d3b0a986484ef8428d81b4db512f94741e89761fe47217dbc7529b5bcfa623
          command:
            - /bin/bash
            - -ec
            - cp -R /opt/keycloak/. /work/
          securityContext: &a1
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: runtime
              mountPath: /work
      containers:
        - name: identity
          image: registry.redhat.io/rhbk/keycloak-rhel9@sha256:52d3b0a986484ef8428d81b4db512f94741e89761fe47217dbc7529b5bcfa623
          command:
            - /opt/keycloak/bin/kc.sh
            - start
            - --import-realm
          securityContext: *a1
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: KC_HOSTNAME
              value: https://identity-secure-delivery-test.apps.acm.sharkbait.tech
            - name: KC_HOSTNAME_STRICT
              value: "true"
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTPS_CERTIFICATE_FILE
              value: /tls/tls.crt
            - name: KC_HTTPS_CERTIFICATE_KEY_FILE
              value: /tls/tls.key
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://delivery-postgres.secure-delivery-test.svc:5432/keycloak?sslmode=verify-full&sslrootcert=/trust/service-ca.crt
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-identity-database
                  key: password
            - name: KC_LOG_LEVEL
              value: warn
          ports:
            - containerPort: 8443
              name: https
          readinessProbe:
            tcpSocket:
              port: 8443
            initialDelaySeconds: 15
            periodSeconds: 5
          volumeMounts:
            - name: runtime
              mountPath: /opt/keycloak
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: trust
              mountPath: /trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: runtime
          emptyDir:
            sizeLimit: 1Gi
        - name: realm
          secret:
            secretName: test-identity-realm
            defaultMode: 288
        - name: tls
          secret:
            secretName: test-identity-tls
            defaultMode: 288
        - name: trust
          configMap:
            name: delivery-service-ca
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: router-to-test-identity
  namespace: secure-delivery-test
  labels:
    app.kubernetes.io/part-of: secure-delivery-test
spec:
  podSelector:
    matchLabels:
      app: test-identity
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: test-identity-to-database
  namespace: secure-delivery-test
  labels:
    app.kubernetes.io/part-of: secure-delivery-test
spec:
  podSelector:
    matchLabels:
      app: delivery-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: test-identity
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: application-to-rgw
  namespace: secure-delivery-test
  labels:
    app.kubernetes.io/part-of: secure-delivery-test
spec:
  podSelector:
    matchLabels:
      app: delivery
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-storage
          podSelector:
            matchLabels:
              app: rook-ceph-rgw
      ports:
        - protocol: TCP
          port: 443
